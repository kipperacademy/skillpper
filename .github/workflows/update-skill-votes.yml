name: Update skill votes

on:
  workflow_dispatch:
    inputs:
      sync_discussions:
        description: Create missing vote discussions before updating the ranking
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  discussions: write

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: skill-votes-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/requirements.txt
      - name: Update vote discussions and ranking
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.sync_discussions }}" != "true" ]; then
            python scripts/update_skill_votes.py
          else
            python scripts/update_skill_votes.py --sync-discussions
          fi
      - name: Commit updated ranking
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- RANKING.md docs/votes.json docs/vote-discussions.json docs/index.html; then
            echo "Community ranking is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RANKING.md docs/votes.json docs/vote-discussions.json docs/index.html
          git commit -m "docs: update skill votes"
          git push origin "HEAD:$DEFAULT_BRANCH"
