name: Cross-platform skill tests

on:
  push:
    branches: [main]
    paths:
      - '**.skill'
      - '*/SKILL.md'
      - '*/references/**'
      - 'tests/**'
      - 'scripts/**'
      - 'RECOMENDATIONS.md'
      - '.github/workflows/cross-platform-tests.yml'
  pull_request:
    paths:
      - '**.skill'
      - '*/SKILL.md'
      - '*/references/**'
      - 'tests/**'
      - 'scripts/**'
      - 'RECOMENDATIONS.md'
      - '.github/workflows/cross-platform-tests.yml'

permissions:
  contents: read

jobs:
  test:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s tests
