name: Check skills index

on:
  push:
    paths:
      - '**/SKILL.md'
      - 'README.md'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/update-skills-index.yml'
  pull_request:
    paths:
      - '**/SKILL.md'
      - 'README.md'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/update-skills-index.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install project test dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Check generated index freshness
        run: python scripts/update_skills_index.py --check

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
